# The rule set is spelled out rather than left to ruff's defaults, which change between releases
# (0.16 added C4, SIM, UP and others). CI pins the ruff version too; see .github/workflows/ci.yml.
#
# The house style puts short statements on one line (`x = 1; y = 2`, `if a: return b`) and uses
# lambdas and one-letter names in dense decoding code, so those rules are off.
target-version = "py310"
line-length = 160

[lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E701", "E702", "E731", "E741", "E402"]
